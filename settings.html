<div id="wxsim_settings" class="wxsim-settings">
  <div class="wxsim-setting-row"><label><input type="checkbox" id="wxsim_enabled" checked> 启用微信模拟器</label></div>
  <div class="wxsim-setting-row"><label>API 模式</label><select id="wxsim_api_mode"><option value="main">继承酒馆当前连接</option><option value="openai">独立 OpenAI-Compatible</option><option value="ollama">Ollama</option></select></div>
  <div id="wxsim_custom_api">
    <div class="wxsim-setting-row"><label>Base URL</label><input id="wxsim_base_url" type="text" placeholder="https://api.openai.com/v1"></div>
    <div class="wxsim-setting-row"><label>API Key</label><input id="wxsim_api_key" type="password" placeholder="可留空"></div>
    <div class="wxsim-setting-row"><label>Model</label><input id="wxsim_model" type="text" placeholder="gpt-4o-mini"></div>
  </div>
  <div class="wxsim-setting-row"><label>Temperature</label><input id="wxsim_temperature" type="number" min="0" max="2" step="0.05" value="0.8"></div>
  <div class="wxsim-setting-row"><label>默认生成条数</label><input id="wxsim_batch" type="number" min="1" max="12" value="3"></div>
  <div class="wxsim-setting-row"><label>微信上下文条数</label><input id="wxsim_max_context" type="number" min="5" max="100" value="40"></div>
  <div class="wxsim-setting-row"><label>正文解析模式</label><select id="wxsim_parse_mode"><option value="marked">仅解析 [微信] 标记（推荐）</option><option value="broad">同时解析 A → B: 内容</option></select></div>
  <div class="wxsim-setting-row"><label>自定义正则（3 个捕获组：发送者、接收者、内容）</label><textarea id="wxsim_regex" rows="3" placeholder="^\s*([^:：]+)\s*(?:→|->|＞)\s*([^:：]+)\s*[:：]\s*(.+)$"></textarea></div>
  <div class="wxsim-setting-row"><label><input type="checkbox" id="wxsim_inject_memory"> 将未计入正文的微信记录注入主提示词</label></div>
  <div class="wxsim-setting-row"><label><input type="checkbox" id="wxsim_auto_roster" checked> 自动从正文捕捉 NPC 联系人</label></div>
  <div class="wxsim-setting-row"><label>AI 回复系统提示词</label><textarea id="wxsim_reply_system" rows="4">你正在模拟微信聊天。严格按照指定角色发送消息，不要替用户说话，不要添加旁白。一次可以返回多条消息。</textarea></div>
  <div class="wxsim-setting-row"><button class="menu_button" id="wxsim_test_api">测试 API</button> <span id="wxsim_api_status"></span></div>
  <div class="wxsim-setting-row"><button class="menu_button" id="wxsim_export">导出微信数据</button> <button class="menu_button" id="wxsim_import">导入微信数据</button></div>
  <div class="wxsim-help">正文推荐格式：<code>[微信] C → D: 你到了吗？</code>。微信记录独立保存到当前聊天的 chat_metadata；“计入正文”只决定是否参与微信记忆注入，不会自动生成主聊天消息。</div>
</div>
