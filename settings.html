<div id="wxsim_settings" class="wxsim-settings">
  <div class="wxsim-setting-row">
    <label><input type="checkbox" id="wxsim_enabled" checked> 启用微信模拟器</label>
  </div>
  <div class="wxsim-setting-row">
    <label>API 模式</label>
    <select id="wxsim_api_mode">
      <option value="main">继承酒馆当前连接（generateRaw）</option>
      <option value="openai">独立 OpenAI-Compatible</option>
      <option value="ollama">Ollama</option>
    </select>
  </div>
  <div id="wxsim_custom_api">
    <div class="wxsim-setting-row"><label>Base URL</label><input id="wxsim_base_url" type="text" placeholder="https://api.openai.com/v1"></div>
    <div class="wxsim-setting-row"><label>API Key</label><input id="wxsim_api_key" type="password" placeholder="可留空"></div>
    <div class="wxsim-setting-row"><label>Model</label><input id="wxsim_model" type="text" placeholder="gpt-4o-mini"></div>
  </div>
  <div class="wxsim-setting-row"><label>Temperature</label><input id="wxsim_temperature" type="number" min="0" max="2" step="0.05" value="0.8"></div>
  <div class="wxsim-setting-row"><label>默认生成条数</label><input id="wxsim_batch" type="number" min="1" max="12" step="1" value="3"></div>
  <div class="wxsim-setting-row">
    <label>正文解析模式</label>
    <select id="wxsim_parse_mode">
      <option value="marked">仅解析带 [微信] 标记的内容（推荐）</option>
      <option value="broad">同时尝试解析 A → B: 内容</option>
    </select>
  </div>
  <div class="wxsim-setting-row">
    <label>自定义正则（可选，必须有 3 个捕获组：发送者、接收者、内容）</label>
    <textarea id="wxsim_regex" rows="3" placeholder="例如：^\s*([^:：]+)\s*(?:→|->|＞)\s*([^:：]+)\s*[:：]\s*(.+)$"></textarea>
  </div>
  <div class="wxsim-setting-row">
    <label><input type="checkbox" id="wxsim_inject_memory"> 将未计入正文的微信记录双向注入主提示词</label>
  </div>
  <div class="wxsim-setting-row">
    <label><input type="checkbox" id="wxsim_auto_roster" checked> 自动从正文捕捉 NPC 联系人</label>
  </div>
  <div class="wxsim-setting-row">
    <button class="menu_button" id="wxsim_test_api">测试 API</button>
    <span id="wxsim_api_status"></span>
  </div>
  <div class="wxsim-help">
    正文推荐写成：<code>[微信] A → B: 你到了吗？</code>。扩展会在消息接收/生成结束后同步。
    微信内部聊天默认保存在当前酒馆聊天的 chat_metadata 中；“不计入正文”表示不会自动写入主聊天消息。
  </div>
</div>
